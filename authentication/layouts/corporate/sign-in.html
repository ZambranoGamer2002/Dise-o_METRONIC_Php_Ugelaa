<!DOCTYPE html>

Based on Metronic 8.2.9

<html lang="es">
<!--begin::Head-->

<head>
	<base href="../../../" />
	<title>UGELAA - Sistema de Trámite | Iniciar Sesión</title>
	<meta charset="utf-8" />
	<meta name="description" content="Sistema de Trámite UGELAA - Inicio de Sesión" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="shortcut icon" href="assets/media/logos/favicon.ico" />
	<!--begin::Fonts-->
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
	<!--end::Fonts-->
	<!--begin::Global Stylesheets Bundle(mandatory for all pages)-->
	<link href="assets/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
	<link href="assets/css/style.bundle.css" rel="stylesheet" type="text/css" />
	<!--end::Global Stylesheets Bundle-->
	<!--begin::UGELAA Login Styles-->
	<link href="assets/css/ugelaa-login.css" rel="stylesheet" type="text/css" />
	<!--end::UGELAA Login Styles-->
	<script>// Frame-busting
		if (window.top != window.self) { window.top.location.replace(window.self.location.href); }</script>
</head>
<!--end::Head-->
<!--begin::Body-->

<body id="kt_body" class="app-blank ugelaa-login">

	<!--begin::Split Layout-->
	<div class="ugelaa-split">

		<!--begin::Left Panel (Blue Branding)-->
		<div class="ugelaa-panel-left">

			<!--begin::Logo-->
			<div class="ugelaa-panel-logo">
				<img src="src/media/logos/logo_ugelaa.png" alt="UGEL Alto Amazonas" />
			</div>
			<!--end::Logo-->

			<!--begin::Branding Text-->
			<div class="ugelaa-panel-branding">
				<h2>Sistema de Trámite</h2>
				<p>UGEL Alto Amazonas — Portal para el registro, seguimiento y gestión de trámites documentarios.</p>
			</div>
			<!--end::Branding Text-->

			<!--begin::Footer-->
			<div class="ugelaa-panel-footer">
				<p class="ugelaa-panel-footer-copy">&copy; 2026 UGEL Alto Amazonas</p>
				<div class="ugelaa-panel-footer-links">
					<a href="#">Soporte</a>
					<a href="#">Legal</a>
					<a href="#">Contacto</a>
				</div>
			</div>
			<!--end::Footer-->

		</div>
		<!--end::Left Panel-->

		<!--begin::Right Panel (Form Area)-->
		<div class="ugelaa-panel-right">

			<!--begin::Form Container-->
			<div class="ugelaa-form-container">

				<!--begin::Header-->
				<div class="ugelaa-form-header">
					<h1>Iniciar Sesión</h1>
					<p>Ingresa tus credenciales para acceder al sistema</p>
				</div>
				<!--end::Header-->

				<!--begin::Form-->
				<form class="ugelaa-form" novalidate="novalidate" id="kt_sign_in_form"
					data-kt-redirect-url="index.html" action="#">

					<!--begin::Usuario Input-->
					<div class="ugelaa-input-group">
						<label class="ugelaa-input-label" for="ugelaa_usuario">Usuario</label>
						<div class="ugelaa-input-wrap">
							<svg class="ugelaa-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
								viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
								stroke-linecap="round" stroke-linejoin="round">
								<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
								<circle cx="12" cy="7" r="4"></circle>
							</svg>
							<input type="text" class="ugelaa-input" id="ugelaa_usuario" name="email"
								placeholder="Ingresa tu usuario" autocomplete="off" required />
						</div>
					</div>
					<!--end::Usuario Input-->

					<!--begin::Contraseña Input-->
					<div class="ugelaa-input-group">
						<label class="ugelaa-input-label" for="ugelaa_password">Contraseña</label>
						<div class="ugelaa-input-wrap">
							<svg class="ugelaa-input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
								viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
								stroke-linecap="round" stroke-linejoin="round">
								<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
								<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
							</svg>
							<input type="password" class="ugelaa-input" id="ugelaa_password" name="password"
								placeholder="Ingresa tu contraseña" autocomplete="off" required />
							<button type="button" class="ugelaa-pw-toggle" id="ugelaa_pw_toggle"
								aria-label="Mostrar contraseña">
								<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
									fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
									stroke-linejoin="round" id="ugelaa_eye_icon">
									<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
									<circle cx="12" cy="12" r="3"></circle>
								</svg>
							</button>
						</div>
					</div>
					<!--end::Contraseña Input-->

					<!--begin::Submit Button-->
					<div class="ugelaa-btn-wrapper">
						<button type="submit" id="kt_sign_in_submit" class="ugelaa-btn-submit">
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
								fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
								stroke-linejoin="round">
								<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
								<polyline points="10 17 15 12 10 7"></polyline>
								<line x1="15" y1="12" x2="3" y2="12"></line>
							</svg>
							<span class="indicator-label">Ingresar</span>
							<span class="indicator-progress" style="display: none;">Verificando...
								<span class="ugelaa-spinner" style="display: inline-block;"></span>
							</span>
						</button>
					</div>
					<!--end::Submit Button-->

				</form>
				<!--end::Form-->

			</div>
			<!--end::Form Container-->

			<!--begin::Right Footer-->
			<div class="ugelaa-right-footer">
				<p>Sistema de Trámite Documentario — UGEL Alto Amazonas</p>
			</div>
			<!--end::Right Footer-->

		</div>
		<!--end::Right Panel-->

	</div>
	<!--end::Split Layout-->

	<!--begin::Javascript-->
	<script>var hostUrl = "assets/";</script>
	<!--begin::Global Javascript Bundle(mandatory for all pages)-->
	<script src="assets/plugins/global/plugins.bundle.js"></script>
	<script src="assets/js/scripts.bundle.js"></script>
	<!--end::Global Javascript Bundle-->
	<!--begin::Custom Javascript(used for this page only)-->
	<script src="assets/js/custom/authentication/sign-in/general.js"></script>
	<!--end::Custom Javascript-->

	<script>
		// ============================================
		// UGELAA Login - Interactive Enhancements
		// ============================================
		document.addEventListener('DOMContentLoaded', function () {
			// --- Password Visibility Toggle ---
			var pwToggle = document.getElementById('ugelaa_pw_toggle');
			var pwInput = document.getElementById('ugelaa_password');
			var eyeIcon = document.getElementById('ugelaa_eye_icon');

			if (pwToggle && pwInput) {
				pwToggle.addEventListener('click', function () {
					var isPassword = pwInput.type === 'password';
					pwInput.type = isPassword ? 'text' : 'password';
					if (isPassword) {
						eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
					} else {
						eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
					}
				});
			}

			// --- Input Focus Effect ---
			document.querySelectorAll('.ugelaa-input').forEach(function (input) {
				input.addEventListener('focus', function () {
					this.closest('.ugelaa-input-wrap').style.transform = 'scale(1.01)';
					this.closest('.ugelaa-input-wrap').style.transition = 'transform 0.2s ease';
				});
				input.addEventListener('blur', function () {
					this.closest('.ugelaa-input-wrap').style.transform = 'scale(1)';
				});
			});
		});
	</script>
	<!--end::Javascript-->
</body>
<!--end::Body-->

</html>
